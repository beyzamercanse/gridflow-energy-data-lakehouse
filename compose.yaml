services:
  minio:
    # SILO preserves the MinIO/S3 protocol but uses a maintained container image.
    image: docker.io/pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - silo_data:/data

volumes:
  silo_data:
