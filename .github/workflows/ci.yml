name: CI
on:
  push:
  pull_request:

jobs:
  ingestion-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev,lake]'
      - name: Python lint
        run: ruff check .
      - name: Offline tests with mock HTTP sources
        run: pytest -q -m 'not integration'
      - name: Syntax compilation
        run: python -m compileall -q src
      - name: Prepare local S3 settings
        run: cp .env.example .env
      - name: Start S3-compatible object store
        run: docker compose up -d --wait
      - name: Run real S3 integration tests
        env:
          S3_ENDPOINT_URL: http://127.0.0.1:9000
          S3_ACCESS_KEY_ID: gridflow_local
          S3_SECRET_ACCESS_KEY: gridflow_local_dev_only_2026
          S3_BUCKET: gridflow-ci-test
          S3_REGION: us-east-1
        run: pytest -q -m integration
      - name: Stop local object store
        if: always()
        run: if [ -f .env ]; then docker compose down --remove-orphans; fi
