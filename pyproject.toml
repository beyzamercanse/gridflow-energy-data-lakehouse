[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "gridflow-energy-data-lakehouse"
version = "0.2.0"
description = "Energy data ingestion and lakehouse engineering portfolio"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
lake = ["boto3>=1.35,<2", "pyarrow>=18,<24"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
gridflow = "gridflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running local S3-compatible object store"]

[tool.ruff]
line-length = 100
